# =============================================================================
# ByteGrader Configuration
# =============================================================================
# 1. Edit this file
# 2. Run: bash deploy.sh
# All settings live here — no interactive prompts.
# =============================================================================

# -----------------------------------------------------------------------------
# Domain Settings
# -----------------------------------------------------------------------------

# Your root domain (e.g. bytegrader.com)
domain: my-domain.com

# Course subdomain (e.g. esp-iot)
# Autograder will be at https://<subdomain>.<domain>/
subdomain: my-course-name

# Email for Let's Encrypt SSL certificate notifications
ssl_email: you@example.com

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------

# IP whitelist: IPv4/IPv6 addresses or CIDR blocks allowed to connect.
# Leave empty ([]) to allow all IPs.
# Example: ["203.0.113.5", "192.168.1.0/24"]
ip_whitelist: []

# API keys for client authentication.
# Leave empty ([]) to disable API key requirement.
# Example: ["my-secret-key"]
api_keys: []

# -----------------------------------------------------------------------------
# Graders
# -----------------------------------------------------------------------------

# Path to your graders directory on the server.
# This can be:
#   - The graders/ folder in the main bytegrader repo (for default graders)
#   - The graders/ folder in your private assignments repo
# If cloning a private repo, git a personal access token (PAT) first. Then, 
# clone your assignments repo before running install.sh:
#   git clone https://<PAT>@github.com/you/your-assignments /home/bytegrader/my-assignments
graders_local_path: /home/bytegrader/bytegrader/graders

# Maps assignment names (used as ?assignment=<name>) to Docker image tags.
# These must match the assignments defined in your graders registry.yaml.
# Example:
#   my-assignment: bytegrader-my-assignment:latest
grader_images:
  make-c-add: bytegrader-make-c-add:latest
  test-stub:  bytegrader-test-stub:latest
  test-delay: bytegrader-test-delay:latest

# -----------------------------------------------------------------------------
# Server Settings
# -----------------------------------------------------------------------------

# Port the ByteGrader server listens on (inside Docker)
app_port: 8080

# Directory where deployed app files live
app_dir: /home/bytegrader/app

# System user that owns and runs ByteGrader
bytegrader_user: bytegrader
